# Very similar to the release build.
{
  'name': 'Nightly build',
  'on': {
    'schedule': [
      {
        'cron': '16 2 * * *'
      }
    ],
    'workflow_dispatch': null
  },
  'jobs':
    {
      'nightly_build':
        {
          'runs-on': 'ubuntu-latest',
          'if': "github.repository_owner == 'LuccoJ'",
          'permissions': { 'contents': 'write' },
          'steps':
            [
              {
                'uses': 'actions/checkout@v6',
                'with': {
                  'fetch-depth': 0
                }
              },
              {
                'name': 'Use Node.js 22.x',
                'uses': 'actions/setup-node@v6',
                'with': { 'node-version': '22.x' },
              },
              { 'name': 'Install', 'run': 'npm ci' },
              {
                'name': 'Generate OpenAPI Docs',
                'run': 'npm run build_openapi_schema',
              },
              {
                'name': 'Build Valetudo frontend',
                'run': 'npm run build --workspace=frontend',
              },
              {
                'name': 'Build Valetudo',
                'run': 'npm run build --workspace=backend',
              },
              {
                'name': 'UPX-compress valetudo binaries',
                'run': 'npm run upx',
              },
              {
                'name': 'Generate changelog',
                'run': 'npm run generate_nightly_changelog',
              },
              {
                'name': 'Build manifest',
                'run': 'npm run build_release_manifest nightly',
              },
              {
                # The updater reads the builds from this repository's nightly-builds branch. It only ever holds the
                # latest build, so it doesn't grow with every night
                'name': 'Push binaries to the nightly-builds branch',
                'env': {
                  'GITHUB_TOKEN': '${{ secrets.GITHUB_TOKEN }}'
                },
                'run': "cd build && git init -q -b nightly-builds && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add -A && git commit -q -m \"Nightly build of ${GITHUB_SHA}\" && git push -f \"https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\" nightly-builds"
              }
            ],
        },
    },
}
